name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Vet, race tests, smoke runner tests and build
        run: make verify
      - name: Check Windows build and lock test compilation
        if: runner.os == 'Linux'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build ./...
          go test -c -o "$RUNNER_TEMP/config-windows.test.exe" ./pkg/config
      - name: Check whitespace
        run: git diff --check

  skill-windows:
    name: Skill installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test native installer
        run: go test -count=1 ./pkg/skillinstall
      - name: Build and install Skill without Python
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/zstack-cli.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/zstack-cli.exe" skill install --agent codex --dest "$env:RUNNER_TEMP/skill test" -o json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$env:RUNNER_TEMP/skill test/zstack-operations/SKILL.md")) { throw "Skill installation missing" }
